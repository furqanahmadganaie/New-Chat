server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: pingme-backend

    static_configs:
      - targets:
          - localhost

        labels:
          job: pingme-backend
          service: pingme-backend
          __path__: /logs/backend.log